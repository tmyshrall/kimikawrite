<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story — The Reading Room</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div>
        <p class="eyebrow" id="eyebrow">Story</p>
        <h1 class="site-title" id="story-title">Loading…</h1>
      </div>
      <a class="back-link" href="index.html">&larr; All stories</a>
    </header>

    <p class="story-blurb-lead" id="story-blurb"></p>

    <ol class="chapter-list" id="chapter-list"></ol>
    <p class="empty-state" id="empty-state" style="display:none;">
      Story not found. <a href="index.html" style="color:var(--brass-bright)">Go back home</a>.
    </p>
  </div>

  <script src="js/data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('s');
    const story = STORIES.find(s => s.slug === slug);

    const titleEl = document.getElementById('story-title');
    const blurbEl = document.getElementById('story-blurb');
    const listEl = document.getElementById('chapter-list');
    const emptyState = document.getElementById('empty-state');

    if (!story) {
      titleEl.textContent = 'Not found';
      emptyState.style.display = 'block';
    } else {
      document.title = story.title + ' — The Reading Room';
      titleEl.textContent = story.title;
      blurbEl.textContent = story.blurb || '';

      story.chapters.forEach((chapter, i) => {
        const li = document.createElement('li');
        li.className = 'chapter-row';
        li.innerHTML = `
          <a class="chapter-link" href="chapter.html?s=${encodeURIComponent(story.slug)}&c=${i}">
            ${chapter.title}
          </a>
        `;
        listEl.appendChild(li);
      });

      if (!story.chapters.length) {
        emptyState.textContent = 'No chapters yet — add one in js/data.js.';
        emptyState.style.display = 'block';
      }
    }
  </script>
</body>
</html>
